version: '3.8'

networks:
  omnichannel-net:
    name: omnichannel-net
    driver: bridge

services:
  # ========================================================
  # Reverse Proxy with Automatic SSL (Caddy)
  # ========================================================
  caddy:
    image: caddy:2-alpine
    container_name: omnichannel-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - omnichannel-net

  # ========================================================
  # FastAPI Middleware Bridge (Chatwoot <-> Dify Orchestrator)
  # ========================================================
  middleware:
    build:
      context: ./middleware
      dockerfile: Dockerfile
    container_name: omnichannel-middleware
    restart: unless-stopped
    env_file:
      - ./middleware/.env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - omnichannel-net

volumes:
  caddy_data:
  caddy_config:
